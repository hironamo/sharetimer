<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Connect Pro - Ultimate</title>
    <style>
        :root {
            --bg-work: #0f172a; --bg-break: #064e3b; --bg-long: #1e3a8a;
            --accent: #38bdf8; --text: #f8fafc; --danger: #ef4444;
        }
        body {
            margin: 0; display: flex; height: 100vh; background-color: var(--bg-work); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            transition: background-color 0.8s; overflow: hidden; touch-action: manipulation;
        }

        /* サイドパネル（レスポンシブ対応） */
        #side-panel {
            width: 280px; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; z-index: 50;
            transition: width 0.3s;
        }
        .panel-section { padding: 20px; flex: 1; overflow-y: auto; }
        h3 { font-size: 0.8rem; letter-spacing: 0.1rem; border-bottom: 1px solid var(--accent); padding-bottom: 8px; margin: 0 0 15px 0; opacity: 0.8; }
        
        /* 期間切り替えタブ */
        .tab-container { display: flex; gap: 4px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 8px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; border: none; background: none; color: white; padding: 8px 0;
            font-size: 0.7rem; cursor: pointer; border-radius: 6px; transition: 0.3s; opacity: 0.5;
        }
        .tab-btn.active { background: var(--accent); color: #000; opacity: 1; font-weight: bold; }

        .ranking-item { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .pomo-count { color: var(--accent); font-weight: bold; }

        /* メインエリア */
        #main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; text-align: center; padding: 20px; }
        #user-config { position: absolute; top: 20px; left: 20px; z-index: 60; }
        input#user-name { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 8px; outline: none; width: 120px; }

        .session-dots { display: flex; gap: 12px; margin-bottom: 1rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: 0.4s; }
        .dot.active { background: var(--accent); box-shadow: 0 0 15px var(--accent); }

        /* タイマー文字サイズ（ミニウィンドウ対応） */
        #timer { font-size: clamp(3rem, 18vw, 12rem); font-weight: 800; font-variant-numeric: tabular-nums; margin: 0; line-height: 1; }
        
        .progress-container { width: 80%; max-width: 500px; margin: 2rem 0; }
        input[type="range"] { width: 100%; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: white; border-radius: 50%; cursor: pointer; }

        .controls { display: flex; gap: 1rem; }
        button.main-btn { padding: 1rem 2rem; font-size: 1rem; border-radius: 50px; border: none; cursor: pointer; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; font-weight: bold; }
        #start-btn { background: var(--text); color: #000; min-width: 120px; }

        /* モバイル・ミニウィンドウ用レスポンシブ */
        @media (max-width: 650px) {
            body { flex-direction: column; }
            #side-panel { width: 100%; height: auto; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
            #timer { font-size: 5rem; }
            #user-config { position: static; margin-bottom: 20px; }
        }

        #long-break-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="side-panel">
        <div class="panel-section">
            <h3>🏆 FRIENDS RANKING</h3>
            <div class="tab-container">
                <button onclick="changeFilter('today')" id="btn-today" class="tab-btn active">今日</button>
                <button onclick="changeFilter('yesterday')" id="btn-yesterday" class="tab-btn">昨日</button>
                <button onclick="changeFilter('weekly')" id="btn-weekly" class="tab-btn">週間</button>
            </div>
            <div id="ranking-list">読み込み中...</div>
            <div style="margin-top: 25px;">
                <button onclick="manualSync()" style="width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem;">今すぐ記録</button>
                <p id="sync-status" style="font-size: 0.7rem; margin-top: 8px; text-align: center; opacity: 0.6;">Ready</p>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div id="user-config">
            <input type="text" id="user-name" placeholder="Name" value="Guest">
        </div>
        <div id="status-label" style="letter-spacing: 0.3rem; opacity: 0.5; margin-bottom: 10px; font-size: 0.8rem;">READY</div>
        <div class="session-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div id="timer">25:00</div>
        <div class="progress-container">
            <input type="range" id="seek-bar" value="0">
        </div>
        <div class="controls">
            <button class="main-btn" onclick="location.reload()">Reset</button>
            <button class="main-btn" id="start-btn">START</button>
        </div>
    </div>

    <div id="long-break-modal">
        <h2 style="font-size: 2rem;">Work Done!</h2>
        <p>長い休憩に入りましょう。</p>
        <div style="display:flex; gap:10px; margin-top: 20px;">
            <button class="main-btn" onclick="setLongBreak(15)">15分</button>
            <button class="main-btn" onclick="setLongBreak(30)">30分</button>
            <button class="main-btn" onclick="setLongBreak(60)">60分</button>
        </div>
    </div>

    <script>
        // --- 設定：GAS URL ---
        const GAS_URL = "https://script.google.com/a/macros/dc.tohoku.ac.jp/s/AKfycbxzehFZ4nNJByJYbZcNLmfSKbdzNUqBiFOrV5xjbdcUnqmh7mwV74j8mdqiD1b6RCxrdw/exec";

        let duration = 25 * 60, timeLeft = 25 * 60, endTime = null, timerId = null, sessions = 1, mode = 'work', currentFilter = 'today';
        const timerDisplay = document.getElementById('timer'), startBtn = document.getElementById('start-btn'), seekBar = document.getElementById('seek-bar');
        const dots = document.querySelectorAll('.dot'), userNameInput = document.getElementById('user-name'), syncStatus = document.getElementById('sync-status');

        if(localStorage.getItem('pomo_name')) userNameInput.value = localStorage.getItem('pomo_name');
        userNameInput.onchange = () => localStorage.setItem('pomo_name', userNameInput.value);

        function updateUI() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            timerDisplay.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            seekBar.max = duration; seekBar.value = duration - timeLeft;
            dots.forEach((dot, i) => dot.classList.toggle('active', i < sessions));
            document.title = `${timerDisplay.textContent} - Focus`;
        }

        function changeFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === 'btn-'+f));
            fetchRanking();
        }

        // バックグラウンドでもズレない「逆算方式」
        startBtn.onclick = () => {
            if (timerId) {
                clearInterval(timerId); timerId = null;
                startBtn.textContent = "START";
            } else {
                endTime = Date.now() + (timeLeft * 1000);
                timerId = setInterval(() => {
                    const diff = endTime - Date.now();
                    timeLeft = Math.max(0, Math.floor(diff / 1000));
                    updateUI();
                    if(timeLeft <= 0) { clearInterval(timerId); timerId = null; handleEnd(); }
                }, 200);
                startBtn.textContent = "PAUSE";
                document.getElementById('status-label').textContent = mode.toUpperCase();
            }
        };

        function manualSync() {
            if(!GAS_URL || GAS_URL.includes("YOUR")) return;
            syncStatus.textContent = "送信中...";
            const form = document.createElement('form');
            form.method = 'POST'; form.action = GAS_URL; form.target = 'hidden_iframe';
            const input = document.createElement('input');
            input.type = 'hidden'; input.name = 'name'; input.value = userNameInput.value || "Guest";
            form.appendChild(input);
            let iframe = document.getElementById('hidden_iframe') || document.body.appendChild(Object.assign(document.createElement('iframe'), {id:'hidden_iframe', name:'hidden_iframe', style:'display:none'}));
            document.body.appendChild(form); form.submit();
            setTimeout(() => { document.body.removeChild(form); syncStatus.textContent = "同期完了"; fetchRanking(); }, 2000);
        }

        function fetchRanking() {
            const old = document.getElementById('gas-jsonp'); if(old) old.remove();
            window.handlePomoData = (data) => {
                const now = new Date(), todayStr = now.toDateString();
                const yesterday = new Date(); yesterday.setDate(now.getDate()-1);
                const sevenDays = new Date(); sevenDays.setDate(now.getDate()-7);
                const counts = {};
                data.forEach((row, i) => {
                    if(i===0 || !row[0]) return;
                    const rDate = new Date(row[0]), rStr = rDate.toDateString(), name = row[1] || "Unknown";
                    let match = (currentFilter==='today' && rStr===todayStr) || (currentFilter==='yesterday' && rStr===yesterday.toDateString()) || (currentFilter==='weekly' && rDate > sevenDays);
                    if(match) counts[name] = (counts[name]||0) + 1;
                });
                const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
                document.getElementById('ranking-list').innerHTML = sorted.length ? sorted.map(([n,c])=>`<div class="ranking-item"><span>${n}</span><span class="pomo-count">${c}ポモ</span></div>`).join('') : `<div style='opacity:0.5;font-size:0.7rem;'>記録なし</div>`;
            };
            const s = document.body.appendChild(document.createElement('script'));
            s.id = 'gas-jsonp'; s.src = `${GAS_URL}?callback=handlePomoData&t=${Date.now()}`;
        }

        function handleEnd() {
            playAlarm();
            if (mode === 'work') {
                manualSync();
                if (sessions >= 4) document.getElementById('long-break-modal').style.display='flex';
                else initBreak(5);
            } else initWork();
        }

        function initWork() { mode='work'; duration=25*60; timeLeft=duration; if(document.getElementById('status-label').textContent !== 'READY') sessions = (sessions>=4)?1:sessions+1; document.body.style.backgroundColor='var(--bg-work)'; updateUI(); }
        function initBreak(m) { mode='break'; duration=m*60; timeLeft=duration; document.body.style.backgroundColor=(m>=15)?'var(--bg-long)':'var(--bg-break)'; updateUI(); }
        function setLongBreak(m) { document.getElementById('long-break-modal').style.display='none'; sessions=4; initBreak(m); }
        function playAlarm() { try { const ctx=new AudioContext(), o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+1); o.start(); o.stop(ctx.currentTime+1); } catch(e){} }

        seekBar.oninput = function() { timeLeft = duration - this.value; updateUI(); };
        fetchRanking(); updateUI();
    </script>
</body>
</html>
