<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Connect - Mini Pro Fix</title>
    <style>
        :root {
            --bg-work: #0f172a; --bg-break: #064e3b; --bg-long: #1e3a8a;
            --accent: #38bdf8; --text: #f8fafc;
        }
        body {
            margin: 0; display: flex; height: 100vh; background-color: var(--bg-work); color: var(--text);
            font-family: -apple-system, sans-serif; transition: background-color 0.8s; overflow: hidden;
        }

        /* --- サイドパネル --- */
        #side-panel {
            width: 260px; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; flex-shrink: 0;
        }
        .panel-section { padding: 20px; flex: 1; overflow-y: auto; }
        .tab-container { display: flex; gap: 4px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; border: none; background: none; color: white; padding: 6px 0; font-size: 0.7rem; cursor: pointer; border-radius: 6px; opacity: 0.5; }
        .tab-btn.active { background: var(--accent); color: #000; opacity: 1; font-weight: bold; }
        .ranking-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* --- メインエリア --- */
        #main-content { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; padding: 20px; min-width: 0;
        }
        #user-config { position: absolute; top: 15px; left: 15px; }
        input#user-name { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 10px; border-radius: 6px; width: 100px; font-size: 0.8rem; }

        #timer { font-size: clamp(3rem, 22vw, 12rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; margin: 10px 0; z-index: 10; }
        .progress-container { width: 90%; max-width: 450px; margin: 20px 0; }
        input[type="range"] { width: 100%; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        .controls { display: flex; gap: 15px; z-index: 20; }
        button.main-btn { padding: 1rem 1.8rem; font-size: 1rem; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; background: rgba(255,255,255,0.1); color: white; font-weight: bold; transition: 0.2s; }
        button.main-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
        #start-btn { background: var(--text); color: #000; min-width: 120px; }

        /* --- ✨ 修正：ミニモード用レスポンシブ（幅が狭い時） --- */
        @media (max-width: 600px) {
            #side-panel { display: none; } /* ランキングを完全に隠す */
            #user-config { display: none; } /* 名前入力も隠してスペース確保 */
            #main-content { justify-content: center; padding: 10px; } /* 中央配置を強化 */
            #timer { font-size: 28vw; margin: 5px 0; }
            .progress-container { width: 85%; margin: 10px 0; }
            .controls { scale: 1.1; margin-top: 10px; } /* ボタンを逆に少し大きくして押しやすく */
        }

        #long-break-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
    </style>
</head>
<body>

    <div id="side-panel">
        <div class="panel-section">
            <h4 style="margin:0 0 10px 0; font-size:0.7rem; opacity:0.6; letter-spacing:1px;">RANKING</h4>
            <div class="tab-container">
                <button onclick="changeFilter('today')" id="btn-today" class="tab-btn active">今日</button>
                <button onclick="changeFilter('yesterday')" id="btn-yesterday" class="tab-btn">昨日</button>
                <button onclick="changeFilter('weekly')" id="btn-weekly" class="tab-btn">週間</button>
            </div>
            <div id="ranking-list">Loading...</div>
            <button onclick="manualSync()" style="width:100%; margin-top:20px; background:var(--accent); border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:0.85rem;">記録を同期</button>
        </div>
    </div>

    <div id="main-content">
        <div id="user-config"><input type="text" id="user-name" placeholder="Name" value="Guest"></div>
        <div id="timer">25:00</div>
        <div class="progress-container"><input type="range" id="seek-bar" value="0"></div>
        <div class="controls">
            <button class="main-btn" onclick="location.reload()">Reset</button>
            <button class="main-btn" id="start-btn">START</button>
        </div>
    </div>

    <div id="long-break-modal">
        <h2>Great Work!</h2>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="main-btn" onclick="setLongBreak(15)">15分</button>
            <button class="main-btn" onclick="setLongBreak(30)">30分</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/a/macros/dc.tohoku.ac.jp/s/AKfycbxzehFZ4nNJByJYbZcNLmfSKbdzNUqBiFOrV5xjbdcUnqmh7mwV74j8mdqiD1b6RCxrdw/exec";

        let duration = 25 * 60, timeLeft = 25 * 60, endTime = null, timerId = null, sessions = 1, mode = 'work', currentFilter = 'today', wakeLock = null;
        const timerDisplay = document.getElementById('timer'), startBtn = document.getElementById('start-btn'), seekBar = document.getElementById('seek-bar'), userNameInput = document.getElementById('user-name');

        if(localStorage.getItem('pomo_name')) userNameInput.value = localStorage.getItem('pomo_name');
        userNameInput.onchange = () => localStorage.setItem('pomo_name', userNameInput.value);

        function updateUI() {
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            timerDisplay.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            seekBar.max = duration; seekBar.value = duration - timeLeft;
            document.title = `${timerDisplay.textContent} - Focus`;
        }

        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        startBtn.onclick = () => {
            if (timerId) {
                clearInterval(timerId); timerId = null; startBtn.textContent = "START";
                if(wakeLock) { wakeLock.release(); wakeLock = null; }
            } else {
                requestWakeLock();
                endTime = Date.now() + (timeLeft * 1000);
                timerId = setInterval(() => {
                    timeLeft = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
                    updateUI();
                    if(timeLeft <= 0) { clearInterval(timerId); timerId = null; handleEnd(); }
                }, 250);
                startBtn.textContent = "PAUSE";
            }
        };

        function changeFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === 'btn-'+f));
            fetchRanking();
        }

        function manualSync() {
            const form = document.body.appendChild(Object.assign(document.createElement('form'), {method:'POST', action:GAS_URL, target:'h_iframe'}));
            form.appendChild(Object.assign(document.createElement('input'), {type:'hidden', name:'name', value:userNameInput.value || "Guest"}));
            if(!document.getElementById('h_iframe')) document.body.appendChild(Object.assign(document.createElement('iframe'), {id:'h_iframe', name:'h_iframe', style:'display:none'}));
            form.submit();
            setTimeout(() => { document.body.removeChild(form); fetchRanking(); }, 2000);
        }

        function fetchRanking() {
            const old = document.getElementById('gas-jsonp'); if(old) old.remove();
            window.handlePomoData = (data) => {
                const now = new Date(), yesterday = new Date(); yesterday.setDate(now.getDate()-1);
                const sevenDays = new Date(); sevenDays.setDate(now.getDate()-7);
                const counts = {};
                data.forEach((row, i) => {
                    if(i===0 || !row[0]) return;
                    const rDate = new Date(row[0]), rStr = rDate.toDateString(), name = row[1] || "Unknown";
                    let match = (currentFilter==='today' && rStr===now.toDateString()) || (currentFilter==='yesterday' && rStr===yesterday.toDateString()) || (currentFilter==='weekly' && rDate > sevenDays);
                    if(match) counts[name] = (counts[name]||0) + 1;
                });
                const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
                document.getElementById('ranking-list').innerHTML = sorted.length ? sorted.map(([n,c])=>`<div class="ranking-item"><span>${n}</span><span style="color:var(--accent); font-weight:bold;">${c}P</span></div>`).join('') : "<div style='opacity:0.5; font-size:0.7rem;'>No Data</div>";
            };
            document.body.appendChild(Object.assign(document.createElement('script'), {id:'gas-jsonp', src:`${GAS_URL}?callback=handlePomoData&t=${Date.now()}`}));
        }

        function handleEnd() {
            playAlarm();
            if (mode === 'work') { manualSync(); if (sessions >= 4) document.getElementById('long-break-modal').style.display='flex'; else initBreak(5); } 
            else initWork();
        }
        function initWork() { mode='work'; duration=25*60; timeLeft=duration; sessions=(sessions>=4)?1:sessions+1; document.body.style.backgroundColor='var(--bg-work)'; updateUI(); }
        function initBreak(m) { mode='break'; duration=m*60; timeLeft=duration; document.body.style.backgroundColor=(m>=15)?'var(--bg-long)':'var(--bg-break)'; updateUI(); }
        function setLongBreak(m) { document.getElementById('long-break-modal').style.display='none'; sessions=4; initBreak(m); }
        function playAlarm() { try { const ctx=new AudioContext(), o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+1); o.start(); o.stop(ctx.currentTime+1); } catch(e){} }

        seekBar.oninput = function() { timeLeft = duration - this.value; updateUI(); };
        fetchRanking(); updateUI();
    </script>
</body>
</html>
